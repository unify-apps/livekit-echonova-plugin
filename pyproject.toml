[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-echonova"
dynamic = ["version"]
description = "LiveKit Agents plugin for EchoNova Arabic and English TTS and STT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

authors = [
    { name = "Darshak Jankat" }
]

keywords = [
    "livekit",
    "echonova",
    "arabic",
    "tts",
    "stt",
    "speech",
    "voice",
    "audio"
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]

# aiohttp and livekit-blingfire (the default sentence tokenizer) are base deps of livekit-agents
dependencies = [
    "livekit-agents>=1.8.3",
]

[project.urls]
Repository = "https://github.com/unify-apps/livekit-echonova-plugin"

[tool.hatch.version]
path = "livekit/plugins/echonova/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["livekit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "UP", "SIM", "PL", "RUF", "ASYNC", "SLF"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["livekit"]

[tool.ruff.lint.pylint]
max-args = 7
